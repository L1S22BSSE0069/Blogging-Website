name: PR Validation

on:
  pull_request:
    branches:
      - develop  # only trigger when PR targets 'develop'

jobs:
  lint:
    name: Lint HTML & CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Linter Tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML Files
        run: |
          htmlhint "src/**/*.html"

      - name: Lint CSS Files
        run: |
          echo '{
            "extends": "stylelint-config-standard"
          }' > .stylelintrc.json
          stylelint "styles/**/*.css"

  build:
    name: Build with Parcel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install parcel

      - name: Build Website
        run: |
          npx parcel build src/index.html --dist-dir dist --no-source-maps
